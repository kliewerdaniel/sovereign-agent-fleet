[pytest]
# Make the repo root importable so `fleet`/`grid`/... resolve without a PYTHONPATH
# env var (the same effect the test commands achieve via `PYTHONPATH=$PWD`).
pythonpath = .
# network: live-venue integration tests that hit external APIs (Kalshi).
# These require real credentials in exchange/.env AND outbound network access;
# they are deselected by default so the offline verification gate is deterministic.
# Run them explicitly with: pytest -m network
markers =
    network: tests that perform live outbound calls to external venues
addopts = -p no:cacheprovider -m "not network"
