name: ci

# Primary test gate for Sovereign Agent Fleet.
# Runs the FULL suite (not just the governance substrate under fleet/tests),
# in an isolated, dependency-leakage-free venv, offline and fast.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base deps (pinned lock, reproducible)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Run full test suite (isolated, offline)
        run: |
          # Strip inherited env leakage so stdlib-only crypto path is what runs.
          env -u PYTHONPATH -u VIRTUAL_ENV python -m pytest -q \
            --disable-warnings -p no:cacheprovider -o addopts=""

      - name: Report pass count
        if: always()
        run: |
          env -u PYTHONPATH -u VIRTUAL_ENV python -m pytest --co -q \
            -p no:cacheprovider -o addopts="" 2>/dev/null | tail -1
